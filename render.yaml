# Render Blueprint: Quelvra is a static site (all math runs in the browser, no server).
services:
  - type: web
    name: quelvra
    runtime: static
    buildCommand: node tools/sw-files.mjs
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
